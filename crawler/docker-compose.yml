services:
  crawler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stac-crawler
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - CRAWL_SCHEDULER_ENABLED=${CRAWL_SCHEDULER_ENABLED:-true}
    networks:
      - stac-network

networks:
  stac-network:
    driver: bridge
